<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JorgeFrancisco</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <input type="radio" name="tema" id="tema-claro" class="tema-input" checked>
  <input type="radio" name="tema" id="tema-oscuro" class="tema-input">
  <input type="radio" name="tema" id="tema-custom" class="tema-input">

  <main class="card">
    <nav class="tabs">
      <label for="tema-claro" class="tab">Claro</label>
      <label for="tema-oscuro" class="tab">Obscuro</label>
      <label for="tema-custom" class="tab">Personalizado</label>
    </nav>

    <h1>Selector De Temas</h1>
    <p>Elige tu tema preferido</p>
    <button type="button" class="boton">Actualizar</button>
  </main>

  <script>
    const card = document.querySelector('.card');
    document.querySelector('.boton').addEventListener('click', () => {
      const tema = document.querySelector('.tema-input:checked').id;
      card.className = 'card ' + tema;
    });

  </script>

<footer class="footer">
  <a href="../index.html">Volver al portal</a>
</footer>
</body>
</html>
