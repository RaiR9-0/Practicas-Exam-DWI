<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Temperatura</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <h1>Conversor de Temperatura</h1>
    <p class="subtitle">Ingresa el valor, elige las unidades y convierte.</p>
  </header>

  <main class="card">
    <form id="formTemp" class="form-temp">
      <input type="number" id="valor" placeholder="Valor" step="any">
      <select id="unidadOrigen">
        <option value="">Unidad origen</option>
        <option value="C">Celsius</option>
        <option value="F">Fahrenheit</option>
        <option value="K">Kelvin</option>
      </select>
      <select id="unidadDestino">
        <option value="">Unidad destino</option>
        <option value="C">Celsius</option>
        <option value="F">Fahrenheit</option>
        <option value="K">Kelvin</option>
      </select>
      <button type="submit" id="botonConvertir" class="boton" disabled>Convertir</button>
    </form>

    <p id="resultado" class="resultado"></p>
  </main>

  <footer class="footer">
    <a href="../index.html">Volver al portal</a>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
