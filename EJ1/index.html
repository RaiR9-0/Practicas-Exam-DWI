<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Edad</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <h1>Calculadora de Edad</h1>
    <p class="subtitle">Ingresa tu fecha de nacimiento con el selector personalizado.</p>
  </header>

  <main class="card">
    <form id="formEdad" class="form-edad">
      <label>Fecha de nacimiento:</label>
      <div class="selectores">
        <select id="dia" required></select>
        <select id="mes" required></select>
        <select id="anio" required></select>
      </div>
      <button type="submit" class="boton">Calcular</button>
    </form>

    <p id="mensajeError" class="error"></p>
    <p id="resultado" class="resultado"></p>
  </main>

  <footer class="footer">
    <a href="../index.html">Volver al portal</a>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
